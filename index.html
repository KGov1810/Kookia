<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kookia</title>
  <meta name="description" content="Le stock de nourriture de la maison, partagé à deux : frigo, congélateur, placard, fruits et légumes, recettes anti-gaspillage et liste de courses.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kookia">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#12463E" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16362F" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <script>
    // Secours : si le style ou le code de l'app ne se charge pas (page périmée juste après une mise à jour),
    // on recharge une fois depuis le serveur ; sinon, un bouton vide les caches de l'app et recharge.
    // Apparence et langue choisies dans Réglages : appliquées avant le premier affichage (pas d'éclair).
    var KOOKIA_LANG = 'fr';
    (function () {
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem('frigo.settings.v1') || '{}'); } catch (e) {}
      if (saved.theme === 'light' || saved.theme === 'dark') document.documentElement.dataset.theme = saved.theme;
      var known = ['fr', 'en', 'es', 'pt'];
      var wanted = [saved.language || ''].concat(navigator.languages || [navigator.language || 'fr']);
      for (var i = 0; i < wanted.length; i++) {
        var id = String(wanted[i]).toLowerCase().split('-')[0];
        if (known.indexOf(id) >= 0) { KOOKIA_LANG = id; break; }
      }
      document.documentElement.lang = KOOKIA_LANG;
    })();
    (function () {
      var KEY = 'kookia.reload';
      function tries() { try { return Number(sessionStorage.getItem(KEY) || 0); } catch (e) { return 1; } }
      function reset() {
        var steps = [];
        if (window.caches) steps.push(caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); }));
        if (navigator.serviceWorker) steps.push(navigator.serviceWorker.getRegistrations().then(function (list) { return Promise.all(list.map(function (r) { return r.unregister(); })); }));
        Promise.all(steps).catch(function () {}).then(function () { location.reload(); });
      }
      function help() {
        if (window.__kookiaReady || document.getElementById('boot-help') || !document.body) return;
        var box = document.createElement('div');
        box.id = 'boot-help';
        box.setAttribute('role', 'alert');
        box.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:32px;background:#FBF6EC;color:#1D2925;font:17px/1.4 -apple-system,system-ui,sans-serif;text-align:center';
        var text = {
          fr: ['Kookia ne s\u2019est pas chargée', 'Vérifiez la connexion internet, puis touchez le bouton. Votre stock ne sera pas perdu : il est enregistré en ligne.', 'Recharger l\u2019app'],
          en: ['Kookia didn\u2019t load', 'Check your internet connection, then tap the button. Your stock won\u2019t be lost: it\u2019s saved online.', 'Reload the app'],
          es: ['Kookia no se cargó', 'Revisa la conexión a internet y toca el botón. Tu inventario no se perderá: está guardado en línea.', 'Recargar la app'],
          pt: ['O Kookia não carregou', 'Confira a conexão com a internet e toque no botão. Seu estoque não será perdido: ele está salvo online.', 'Recarregar o app']
        }[KOOKIA_LANG];
        box.innerHTML = '<strong style="font-size:20px">' + text[0] + '</strong><span>' + text[1] + '</span>';
        var button = document.createElement('button');
        button.textContent = text[2];
        button.style.cssText = 'align-self:center;padding:14px 24px;border:0;border-radius:14px;background:#12463E;color:#fff;font:600 17px -apple-system,system-ui,sans-serif';
        button.onclick = reset;
        box.appendChild(button);
        document.body.appendChild(box);
      }
      function recover() {
        if (window.__kookiaReady || window.__kookiaRecovering) return;
        window.__kookiaRecovering = true;
        if (tries() < 1) {
          try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
          location.reload();
        } else if (document.body) {
          help();
        } else {
          document.addEventListener('DOMContentLoaded', help);
        }
      }
      window.addEventListener('error', function (event) {
        var el = event.target;
        var url = el && (el.src || el.href);
        if (url && (el.tagName === 'SCRIPT' || el.tagName === 'LINK') && url.indexOf(location.origin) === 0) recover();
      }, true);
      setTimeout(help, 20000);
    })();
  </script>
  <script src="config.js"></script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main id="screen" tabindex="-1">
    <div class="boot"><span class="spinner"></span></div>
  </main>

  <nav class="tabbar" aria-label="Navigation principale">
    <button class="tab" data-tab="frigo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5h8M7.5 6.5h9a1.5 1.5 0 0 1 1.5 1.5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8a1.5 1.5 0 0 1 1.5-1.5z"/><path d="M8.5 3.5v3M15.5 3.5v3M6 11h12"/></svg>
      <span>Stock</span><b class="tab-badge" data-badge="frigo" hidden></b>
    </button>
    <button class="tab" data-tab="recettes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2.5v6.5a2 2 0 0 0 4 0V2.5M9 11v10.5M17 21.5V2.5c-2 1-3.2 3.4-3.2 7v3.8H17"/></svg>
      <span>Recettes</span>
    </button>
    <button class="nav-add" data-action="add-menu" aria-label="Ajouter un produit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-tab="courses">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/><path d="M3 3.5h2.2l2.3 11.5h10.8l2-8H6.3"/></svg>
      <span>Courses</span><b class="tab-badge" data-badge="courses" hidden></b>
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20.5h16"/><path d="M7 17v-4.5M12 17V7M17 17v-7.5"/></svg>
      <span>Stats</span>
    </button>
  </nav>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script>
    // Barre du bas dans la langue de l'iPhone dès le premier affichage (mêmes textes que tab.* dans l'app).
    (function () {
      var labels = {
        en: ['Stock', 'Recipes', 'Groceries', 'Stats', 'Main navigation', 'Add a product'],
        es: ['Inventario', 'Recetas', 'Compras', 'Cifras', 'Navegación principal', 'Agregar un producto'],
        pt: ['Estoque', 'Receitas', 'Compras', 'Números', 'Navegação principal', 'Adicionar um produto']
      }[KOOKIA_LANG];
      if (!labels) return;
      var spans = document.querySelectorAll('.tabbar .tab span');
      for (var i = 0; i < spans.length && i < 4; i++) spans[i].textContent = labels[i];
      document.querySelector('.tabbar').setAttribute('aria-label', labels[4]);
      document.querySelector('.nav-add').setAttribute('aria-label', labels[5]);
    })();
  </script>
</body>
</html>
